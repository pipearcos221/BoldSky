name: Android CI

on:
  push:
    branches: [ "main", "develop", "feature/**", "chore/**" ]
  pull_request:
    branches: [ "main", "develop", "feature/**", "chore/**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Secrets Properties File
        run: |
          if [ -n "${{ secrets.API_KEY }}" ]; then
            echo "API_KEY=${{ secrets.API_KEY }}" > ${{ github.workspace }}/secrets.properties
          else
            echo "Secrets not found. Proceeding without them."
          fi
        shell: bash

      - name: Grant executable permissions to gradlew
        run: chmod +x gradlew

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug
